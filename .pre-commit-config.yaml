repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff
        entry: make lint
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: make typecheck
        language: system
        types_or: [python, pyi]
        pass_filenames: false
