[project]
name = "condorium"
version = "0.1.0"
description = "A two-layer multi-agent idea committee: generators upstream, a calibrated evaluation panel downstream. No flattery, no lazy rejection."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Wassim Badraoui" }]
keywords = ["multi-agent", "langgraph", "hackathon", "idea-evaluation", "llm"]
dependencies = [
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "litellm>=1.55.0",
    "networkx>=3.2",
    "plotly>=5.24",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.14", "ruff>=0.6"]

[project.scripts]
panel = "condorium.cli:main"

[project.urls]
Repository = "https://github.com/wassimbadraoui/condorium"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/condorium"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
