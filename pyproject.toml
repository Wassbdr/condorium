[project]
name = "condorium"
version = "0.1.0"
description = "A two-layer multi-agent idea committee: generators upstream, a calibrated evaluation panel downstream. No flattery, no lazy rejection."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Wassim Badraoui" }]
keywords = ["multi-agent", "langgraph", "hackathon", "idea-evaluation", "llm"]
dependencies = [
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "litellm>=1.55.0",
    "networkx>=3.2",
    "plotly>=5.24",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.14", "ruff>=0.6"]
ui = ["gradio>=4.44,<6"]
showcase = ["matplotlib>=3.8"]

[project.scripts]
panel = "condorium.cli:main"

[project.urls]
Repository = "https://github.com/Wassbdr/condorium"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/condorium"]

# prompts + demo traces ship inside the wheel so `pip install` / `uvx` work
# outside a source checkout (see config.BUNDLED_DIR)
[tool.hatch.build.targets.wheel.force-include]
"agents" = "condorium/_data/agents"
"fixtures/demo" = "condorium/_data/fixtures/demo"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
