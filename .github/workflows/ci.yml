name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install
        run: make install PYTHON="${{ matrix.python-version }}"
      - name: Lint, typecheck, test, and replay the demo offline
        run: make -k lint typecheck test demo
